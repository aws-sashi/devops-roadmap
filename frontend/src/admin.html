<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Panel | TryNewCloud
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #080d1a;

            color: white;

        }


        .header {

            padding: 20px 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid #263455;

            background: #0d1426;

        }


        .logo {

            font-size: 22px;

            font-weight: bold;

        }


        .logout {

            padding: 10px 18px;

            border: 0;

            border-radius: 7px;

            background: #e05260;

            color: white;

            cursor: pointer;

        }


        .container {

            max-width: 1400px;

            margin: auto;

            padding: 40px 20px;

        }


        .login {

            max-width: 420px;

            margin:
                100px auto;

            background: #111a30;

            padding: 35px;

            border:
                1px solid #293657;

            border-radius: 15px;

        }


        .login h1 {

            margin-top: 0;

        }


        label {

            display: block;

            margin:
                15px 0 7px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #34436a;

            border-radius: 7px;

            background: #080d1a;

            color: white;

        }


        button {

            font-size: 15px;

        }


        .login button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: 0;

            border-radius: 7px;

            background: #617fff;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        .error {

            margin-top: 15px;

            color: #ff8e99;

        }


        .dashboard {

            display: none;

        }


        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }


        .stat {

            padding: 25px;

            background: #111a30;

            border:
                1px solid #293657;

            border-radius: 12px;

        }


        .stat h2 {

            margin: 0;

            font-size: 32px;

            color: #7e97ff;

        }


        .stat p {

            color: #9ca8c1;

        }


        .table-container {

            overflow-x: auto;

            background: #111a30;

            border:
                1px solid #293657;

            border-radius: 12px;

        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 1000px;

        }


        th,
        td {

            padding: 15px;

            text-align: left;

            border-bottom:
                1px solid #263455;

        }


        th {

            background: #17213a;

            color: #aebeff;

        }


        td {

            color: #d4dbeb;

        }


        .status {

            padding: 6px 10px;

            border-radius: 20px;

            border: 0;

            background: #1d2945;

            color: white;

        }


        .delete {

            padding: 7px 12px;

            border: 0;

            border-radius: 6px;

            background: #7d2834;

            color: white;

            cursor: pointer;

        }


        .refresh {

            padding: 10px 18px;

            border: 0;

            border-radius: 7px;

            background: #617fff;

            color: white;

            cursor: pointer;

        }


        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .empty {

            padding: 40px;

            text-align: center;

            color: #8d9ab5;

        }


        @media(max-width: 800px) {

            .stats {

                grid-template-columns:
                    1fr 1fr;

            }

            .topbar {

                gap: 15px;

                align-items: flex-start;

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        ⚡ TryNewCloud Admin
    </div>

    <button
        id="logout"
        class="logout"
    >
        Logout
    </button>

</header>



<!-- LOGIN -->

<div
    id="login-container"
    class="container"
>


    <div class="login">


        <h1>
            Admin Login
        </h1>


        <p>
            Login to manage admission inquiries.
        </p>


        <form id="login-form">


            <label>
                Username
            </label>


            <input
                id="username"
                type="text"
                required
            >


            <label>
                Password
            </label>


            <input
                id="password"
                type="password"
                required
            >


            <button
                type="submit"
            >
                Login
            </button>


            <div
                id="login-error"
                class="error"
            ></div>


        </form>


    </div>


</div>



<!-- DASHBOARD -->

<div
    id="dashboard"
    class="dashboard container"
>


    <div class="topbar">


        <div>

            <h1>
                Admission Inquiries
            </h1>

            <p>
                Manage all student inquiries.
            </p>

        </div>


        <button
            id="refresh"
            class="refresh"
        >
            ↻ Refresh
        </button>


    </div>



    <div class="stats">


        <div class="stat">

            <h2 id="total">
                0
            </h2>

            <p>
                Total
            </p>

        </div>


        <div class="stat">

            <h2 id="new">
                0
            </h2>

            <p>
                New
            </p>

        </div>


        <div class="stat">

            <h2 id="contacted">
                0
            </h2>

            <p>
                Contacted
            </p>

        </div>


        <div class="stat">

            <h2 id="converted">
                0
            </h2>

            <p>
                Converted
            </p>

        </div>


    </div>



    <div class="table-container">


        <table>


            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Email
                    </th>

                    <th>
                        Mobile
                    </th>

                    <th>
                        Course
                    </th>

                    <th>
                        Qualification
                    </th>

                    <th>
                        Experience
                    </th>

                    <th>
                        Message
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="inquiries">

            </tbody>


        </table>


        <div
            id="empty"
            class="empty"
        >
            No inquiries found.
        </div>


    </div>


</div>



<script>

const loginContainer =
    document.getElementById(
        "login-container"
    );

const dashboard =
    document.getElementById(
        "dashboard"
    );

const loginForm =
    document.getElementById(
        "login-form"
    );

const loginError =
    document.getElementById(
        "login-error"
    );

const inquiriesTable =
    document.getElementById(
        "inquiries"
    );

const empty =
    document.getElementById(
        "empty"
    );

const token =
    () =>
        localStorage.getItem(
            "admin_token"
        );


// --------------------------------------------------
// Login
// --------------------------------------------------

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        loginError.textContent = "";

        try {

            const response =
                await fetch(
                    "/api/admin/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    document
                                        .getElementById(
                                            "username"
                                        )
                                        .value,

                                password:
                                    document
                                        .getElementById(
                                            "password"
                                        )
                                        .value

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message
                );

            }


            localStorage.setItem(
                "admin_token",
                data.token
            );


            showDashboard();


        } catch (error) {

            loginError.textContent =
                error.message;

        }

    }
);


// --------------------------------------------------
// Show Dashboard
// --------------------------------------------------

function showDashboard() {

    loginContainer.style.display =
        "none";

    dashboard.style.display =
        "block";

    loadInquiries();

}


// --------------------------------------------------
// Load Inquiries
// --------------------------------------------------

async function loadInquiries() {

    try {

        const response =
            await fetch(
                "/api/admin/inquiries",
                {

                    headers: {

                        Authorization:
                            `Bearer ${token()}`

                    }

                }
            );


        if (response.status === 401) {

            logout();

            return;

        }


        const data =
            await response.json();


        renderInquiries(
            data.inquiries
        );


    } catch (error) {

        console.error(error);

    }

}


// --------------------------------------------------
// Render
// --------------------------------------------------

function renderInquiries(
    inquiries
) {

    inquiriesTable.innerHTML = "";

    empty.style.display =
        inquiries.length
            ? "none"
            : "block";


    let newCount = 0;

    let contactedCount = 0;

    let convertedCount = 0;


    inquiries.forEach(
        inquiry => {


            if (
                inquiry.status === "New"
            ) {
                newCount++;
            }


            if (
                inquiry.status === "Contacted"
            ) {
                contactedCount++;
            }


            if (
                inquiry.status === "Converted"
            ) {
                convertedCount++;
            }


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${inquiry.id}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.name
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.email
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.phone
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.course
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.qualification || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.experience || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        inquiry.message || "-"
                    )}
                </td>

                <td>

                    <select
                        class="status"
                        onchange="updateStatus(
                            ${inquiry.id},
                            this.value
                        )"
                    >

                        <option
                            ${
                                inquiry.status === "New"
                                ? "selected"
                                : ""
                            }
                        >
                            New
                        </option>

                        <option
                            ${
                                inquiry.status === "Contacted"
                                ? "selected"
                                : ""
                            }
                        >
                            Contacted
                        </option>

                        <option
                            ${
                                inquiry.status === "Interested"
                                ? "selected"
                                : ""
                            }
                        >
                            Interested
                        </option>

                        <option
                            ${
                                inquiry.status === "Converted"
                                ? "selected"
                                : ""
                            }
                        >
                            Converted
                        </option>

                        <option
                            ${
                                inquiry.status === "Rejected"
                                ? "selected"
                                : ""
                            }
                        >
                            Rejected
                        </option>

                    </select>

                </td>

                <td>
                    ${new Date(
                        inquiry.created_at
                    ).toLocaleString()}
                </td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteInquiry(
                            ${inquiry.id}
                        )"
                    >
                        Delete
                    </button>

                </td>

            `;


            inquiriesTable.appendChild(
                row
            );

        }
    );


    document.getElementById(
        "total"
    ).textContent =
        inquiries.length;


    document.getElementById(
        "new"
    ).textContent =
        newCount;


    document.getElementById(
        "contacted"
    ).textContent =
        contactedCount;


    document.getElementById(
        "converted"
    ).textContent =
        convertedCount;

}


// --------------------------------------------------
// Update Status
// --------------------------------------------------

async function updateStatus(
    id,
    status
) {

    await fetch(
        `/api/admin/inquiries/${id}/status`,
        {

            method: "PATCH",

            headers: {

                "Content-Type":
                    "application/json",

                Authorization:
                    `Bearer ${token()}`

            },

            body:
                JSON.stringify({
                    status
                })

        }
    );


    loadInquiries();

}


// --------------------------------------------------
// Delete
// --------------------------------------------------

async function deleteInquiry(
    id
) {

    if (
        !confirm(
            "Are you sure you want to delete this inquiry?"
        )
    ) {

        return;

    }


    await fetch(
        `/api/admin/inquiries/${id}`,
        {

            method: "DELETE",

            headers: {

                Authorization:
                    `Bearer ${token()}`

            }

        }
    );


    loadInquiries();

}


// --------------------------------------------------
// Escape HTML
// --------------------------------------------------

function escapeHtml(
    value
) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


// --------------------------------------------------
// Logout
// --------------------------------------------------

function logout() {

    localStorage.removeItem(
        "admin_token"
    );

    location.reload();

}


document.getElementById(
    "logout"
).addEventListener(
    "click",
    logout
);


document.getElementById(
    "refresh"
).addEventListener(
    "click",
    loadInquiries
);


// --------------------------------------------------
// Existing Login
// --------------------------------------------------

if (token()) {

    showDashboard();

}

</script>


</body>

</html>
